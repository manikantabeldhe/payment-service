spring:
  datasource:
    url: jdbc:mysql://order-management-mysql:3306/order_management
    username:   ${DB_USERNAME}
    password:  ${DB_PASSWORD}

  kafka:
    bootstrap-servers: kafka-local:29092
    listener:
      observation-enabled: true

eureka:
  client:
    enabled: false

management:
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://otel-collector:4318/v1/traces
  opentelemetry:
    resource-attributes:
      service.name: payment-service

logging:
  level:
    io.micrometer.tracing: DEBUG
    io.opentelemetry: DEBUG
    org.springframework.kafka.listener: DEBUG